[project]
name = "payments"
version = "0.1.0"
description = "Transactional payment processing with durable delivery and provider reconciliation"
authors = [
    {name = "shirohir0",email = "shirohiro93@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.156.2,<0.157.0)",
    "starlette (>=1.3.1,<2.0.0)",
    "uvicorn[standard] (>=0.40.0,<1.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "alembic (>=1.13.0,<2.0.0)",
    "celery (>=5.4.0,<6.0.0)",
    "prometheus-client (>=0.21.0,<1.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
pytest-asyncio = ">=0.26.0,<1.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
ruff = ">=0.11.0,<1.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires an isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["app"]
omit = ["app/infrastructure/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
